<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8" />
    <!-- Pinch-zoom stays enabled (WCAG 1.4.4): field data like GPS coordinates
         and table cells is rendered small, and low-vision users need to be able
         to magnify it. The drawing canvas sets its own touch-action locally. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <style>
      html {
        touch-action: pan-x pan-y pinch-zoom;
        -ms-touch-action: pan-x pan-y;
      }
      body {
        touch-action: pan-x pan-y pinch-zoom;
        overflow: hidden;
        position: fixed;
        width: 100%;
        height: 100%;
      }
    </style>
    <title>Turtle Guard</title>
    <script>
      // The other half of 404.html's redirect: a path GitHub Pages could not
      // serve directly (nests/42, turtles/7, ...) arrives here as
      // ?redirect=<path>. Restore it with replaceState before anything else
      // runs, so the app's own routing (lib/routing.ts) reads the real path
      // on its very first render instead of the bare root.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (redirect === null) return;
        var base = '/turtle-frontend/';
        window.history.replaceState(null, '', base + redirect);
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#137fec" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom": "https://esm.sh/react-dom@^19.2.4"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
