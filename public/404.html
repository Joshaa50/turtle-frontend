<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turtle Guard</title>
  <script>
    // A static host with no SPA rewrite rule serves this file for any path it
    // has no actual file for - which, now that the app pushes a real path per
    // screen (nests/42, turtles/7, ...), is every refresh or shared link to a
    // screen other than the bare root. The screen is still React state rather
    // than a server route, so there is nothing here to render it from
    // directly - but the path itself is worth keeping, carried through as a
    // query string the app's own bootstrap script (in index.html) restores
    // before it mounts. Same trick as https://github.com/rafgraph/spa-github-pages.
    // On a host that rewrites every path to index.html (e.g. Render's own
    // rewrite rules), this file is never actually served - harmless either way.
    (function () {
      var base = '/';
      var loc = window.location;
      if (loc.pathname === base && !loc.search && !loc.hash) return;
      var attempted = loc.pathname.slice(base.length) + loc.search + loc.hash;
      loc.replace(base + '?redirect=' + encodeURIComponent(attempted));
    })();
  </script>
</head>
<body>
  <p>Redirecting to Turtle Guard&hellip;</p>
  <p><a href="/">Continue to the portal</a></p>
</body>
</html>
